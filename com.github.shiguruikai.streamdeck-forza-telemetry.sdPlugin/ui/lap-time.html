<!doctype html>
<html>
  <head lang="en">
    <meta charset="utf-8" />
    <link rel="stylesheet" href="common.css" />
    <script src="sdpi-components.js"></script>
  </head>
  <body>
    <div class="settings-group">
      <div class="settings-group-title">Global Settings</div>
      <sdpi-item label="IP Address">
        <sdpi-textfield
          setting="address"
          pattern="^(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])(\.(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])){3}$"
          required
          global
        ></sdpi-textfield>
      </sdpi-item>

      <sdpi-item label="Port">
        <sdpi-textfield setting="port" pattern="^\d+$" required global></sdpi-textfield>
      </sdpi-item>
    </div>

    <div class="settings-group">
      <div class="settings-group-title">Action Settings</div>
      <sdpi-item label="Display Mode">
        <sdpi-select setting="mode" default="best">
          <option value="best">BEST (Best Lap)</option>
          <option value="last">LAST (Last Lap)</option>
        </sdpi-select>
      </sdpi-item>
    </div>
  </body>
</html>
