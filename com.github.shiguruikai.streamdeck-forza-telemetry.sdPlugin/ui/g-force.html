<!doctype html>
<html>
  <head lang="en">
    <meta charset="utf-8" />
    <link rel="stylesheet" href="common.css" />
    <script src="sdpi-components.js"></script>
  </head>
  <body>
    <div class="settings-group">
      <div class="settings-group-title">Global Settings</div>
      <sdpi-item label="IP Address">
        <sdpi-textfield
          setting="address"
          pattern="^(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])(\.(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])){3}$"
          required
          global
        ></sdpi-textfield>
      </sdpi-item>

      <sdpi-item label="Port">
        <sdpi-textfield setting="port" pattern="^([1-9]|[1-9]\d{1,3}|[1-5]\d{4}|6[0-4]\d{3}|65[0-4]\d{2}|655[0-2]\d|6553[0-5])$" required global></sdpi-textfield>
      </sdpi-item>

      <sdpi-item label="Font">
        <sdpi-select
          setting="font"
          datasource="getFonts"
          loading="Fetching fonts..."
          hot-reload
          show-refresh
          global
        >
        </sdpi-select>
      </sdpi-item>
    </div>

    <div class="settings-group">
      <div class="settings-group-title">Action Settings</div>
      <sdpi-item label="Show Title">
        <sdpi-checkbox setting="showTitle" default="true"></sdpi-checkbox>
      </sdpi-item>

      <sdpi-item label="Show Peak G">
        <sdpi-checkbox setting="showPeakG" default="true"></sdpi-checkbox>
      </sdpi-item>

      <sdpi-item label="Display Scale">
        <sdpi-select setting="scale" value-type="number" default="2">
          <option value="1">1.0G</option>
          <option value="2">2.0G</option>
          <option value="3">3.0G</option>
        </sdpi-select>
      </sdpi-item>
    </div>
  </body>
</html>
