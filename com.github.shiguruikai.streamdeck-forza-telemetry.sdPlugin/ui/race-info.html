<!doctype html>
<html>
  <head lang="en">
    <meta charset="utf-8" />
    <link rel="stylesheet" href="common.css" />
    <script src="sdpi-components.js"></script>
    <script src="components/global-settings.js"></script>
  </head>
  <body>
    <div class="tab-container">
      <input type="radio" id="tab-action-select" class="tab-input" name="pi-tabs" checked />
      <input type="radio" id="tab-global-select" class="tab-input" name="pi-tabs" />

      <div class="tab-headers">
        <label for="tab-action-select" class="tab-button">Action</label>
        <label for="tab-global-select" class="tab-button">Global</label>
      </div>

      <div class="tab-content" id="content-action">
        <sdpi-item label="Display Layout">
          <sdpi-select setting="layout" default="lap-time">
            <option value="lap-time">Lap Time</option>
            <option value="race-time">Race Time</option>
            <option value="race-time-only">Race Time Only</option>
            <option value="current-time-only">Current Lap Time Only</option>
            <option value="best-time-only">Best Lap Time Only</option>
            <option value="lap-only">Lap Number Only</option>
            <option value="position-only">Position Only</option>
          </sdpi-select>
        </sdpi-item>
      </div>

      <div class="tab-content" id="content-global">
        <global-settings></global-settings>
      </div>
    </div>
  </body>
</html>
