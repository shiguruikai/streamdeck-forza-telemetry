<!doctype html>
<html>
  <head lang="en">
    <meta charset="utf-8" />
    <link rel="stylesheet" href="common.css" />
    <script src="sdpi-components.js"></script>
    <script src="components/global-settings.js"></script>
  </head>
  <body>
    <div class="tab-container">
      <input type="radio" id="tab-action-select" class="tab-input" name="pi-tabs" checked />
      <input type="radio" id="tab-global-select" class="tab-input" name="pi-tabs" />

      <div class="tab-headers">
        <label for="tab-action-select" class="tab-button">Action</label>
        <label for="tab-global-select" class="tab-button">Global</label>
      </div>

      <div class="tab-content" id="content-action">
        <sdpi-item label="Display Layout">
          <sdpi-select setting="layout" default="full">
            <option value="full">Full (Speed, Gear, RPM)</option>
            <option value="speed">Speed Only</option>
            <option value="gear">Gear Only</option>
            <option value="rpm">RPM Only</option>
          </sdpi-select>
        </sdpi-item>

        <sdpi-item label="Speed Unit" id="unit-item">
          <sdpi-select setting="unit" default="kmh">
            <option value="kmh">KM/H</option>
            <option value="mph">MPH</option>
          </sdpi-select>
        </sdpi-item>
      </div>

      <div class="tab-content" id="content-global">
        <global-settings></global-settings>
      </div>
    </div>
  </body>
</html>
