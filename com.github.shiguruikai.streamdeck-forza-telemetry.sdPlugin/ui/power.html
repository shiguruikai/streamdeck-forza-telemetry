<!doctype html>
<html>
  <head lang="en">
    <meta charset="utf-8" />
    <link rel="stylesheet" href="common.css" />
    <script src="sdpi-components.js"></script>
  </head>
  <body>
    <div class="tab-container">
      <input type="radio" id="tab-action-select" class="tab-input" name="pi-tabs" checked />
      <input type="radio" id="tab-global-select" class="tab-input" name="pi-tabs" />

      <div class="tab-headers">
        <label for="tab-action-select" class="tab-button">Action</label>
        <label for="tab-global-select" class="tab-button">Global</label>
      </div>

      <div class="tab-content" id="content-action">
        <sdpi-item label="Display Layout">
          <sdpi-select setting="layout" default="both">
            <option value="both">Power & Torque</option>
            <option value="power">Power Only</option>
            <option value="torque">Torque Only</option>
          </sdpi-select>
        </sdpi-item>

        <sdpi-item label="Unit Preset">
          <sdpi-select setting="preset" default="ps-nm">
            <option value="ps-nm">PS & N·m (Metric / Modern)</option>
            <option value="ps-kgfm">PS & kgf·m (Metric / Japanese Traditional)</option>
            <option value="hp-ftlb">HP & ft·lb (Imperial / US)</option>
            <option value="kw-nm">kW & N·m (SI / EV)</option>
          </sdpi-select>
        </sdpi-item>
      </div>

      <div class="tab-content" id="content-global">
        <sdpi-item label="IP Address">
          <sdpi-textfield
            setting="address"
            pattern="^(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])(\.(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])){3}$"
            required
            global
          ></sdpi-textfield>
        </sdpi-item>

        <sdpi-item label="Port">
          <sdpi-textfield setting="port" pattern="^([1-9]|[1-9]\d{1,3}|[1-5]\d{4}|6[0-4]\d{3}|65[0-4]\d{2}|655[0-2]\d|6553[0-5])$" required global></sdpi-textfield>
        </sdpi-item>

        <sdpi-item label="Font">
          <sdpi-select
            setting="font"
            datasource="getFonts"
            loading="Fetching fonts..."
            hot-reload
            show-refresh
            global
          >
          </sdpi-select>
        </sdpi-item>

        <sdpi-item label="Frame Rate (FPS)">
          <sdpi-select setting="fps" default="15" global>
            <option value="10">10 FPS</option>
            <option value="15">15 FPS</option>
            <option value="20">20 FPS</option>
            <option value="25">25 FPS</option>
            <option value="30">30 FPS</option>
          </sdpi-select>
        </sdpi-item>
      </div>
    </div>
  </body>
</html>
