<!doctype html>
<html>
  <head lang="en">
    <meta charset="utf-8" />
    <link rel="stylesheet" href="common.css" />
    <script src="sdpi-components.js"></script>
    <script src="components/global-settings.js"></script>
  </head>
  <body>
    <div class="tab-container">
      <input type="radio" id="tab-action-select" class="tab-input" name="pi-tabs" checked />
      <input type="radio" id="tab-global-select" class="tab-input" name="pi-tabs" />

      <div class="tab-headers">
        <label for="tab-action-select" class="tab-button">Action</label>
        <label for="tab-global-select" class="tab-button">Global</label>
      </div>

      <div class="tab-content" id="content-action">
        <sdpi-item label="Display Position">
          <sdpi-select setting="position" default="all">
            <option value="all">All Wheels</option>
            <option value="fl">Front Left (FL)</option>
            <option value="fr">Front Right (FR)</option>
            <option value="rl">Rear Left (RL)</option>
            <option value="rr">Rear Right (RR)</option>
          </sdpi-select>
        </sdpi-item>

        <sdpi-item label="Display Mode">
          <sdpi-select setting="mode" default="percentage">
            <option value="percentage">Percentage (%)</option>
            <option value="value">Raw Value (0.0-1.0)</option>
          </sdpi-select>
        </sdpi-item>
      </div>

      <div class="tab-content" id="content-global">
        <global-settings></global-settings>
      </div>
    </div>
  </body>
</html>
