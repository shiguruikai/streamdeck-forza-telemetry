<!doctype html>
<html>
  <head lang="en">
    <meta charset="utf-8" />
    <link rel="stylesheet" href="common.css" />
    <script src="sdpi-components.js"></script>
  </head>
  <body>
    <div class="settings-group">
      <div class="settings-group-title">Global Settings</div>
      <sdpi-item label="IP Address">
        <sdpi-textfield
          setting="address"
          pattern="^(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])(\.(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])){3}$"
          required
          global
        ></sdpi-textfield>
      </sdpi-item>

      <sdpi-item label="Port">
        <sdpi-textfield setting="port" pattern="^\d+$" required global></sdpi-textfield>
      </sdpi-item>
    </div>

    <div class="settings-group">
      <div class="settings-group-title">Action Settings</div>
      <sdpi-item label="Display Position">
        <sdpi-select setting="position" default="all">
          <option value="all">All Wheels</option>
          <option value="fl">Front Left (FL)</option>
          <option value="fr">Front Right (FR)</option>
          <option value="rl">Rear Left (RL)</option>
          <option value="rr">Rear Right (RR)</option>
        </sdpi-select>
      </sdpi-item>

      <sdpi-item label="Value Mode">
        <sdpi-select setting="mode" default="percentage">
          <option value="percentage">Percentage (%)</option>
          <option value="value">Raw Value (0.0-1.0)</option>
        </sdpi-select>
      </sdpi-item>
    </div>
  </body>
</html>
