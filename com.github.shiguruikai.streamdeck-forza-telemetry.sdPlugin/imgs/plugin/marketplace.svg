<svg xmlns="http://www.w3.org/2000/svg"
  width="512"
  height="512"
  viewBox="0 0 400 400"
  fill="#FFFFFF"
>
  <defs>
    <linearGradient id="grad" gradientTransform="rotate(45)">
      <!-- Forza Horizon のロゴに使用されているオレンジ（#EF6332）とマゼンタ（#E83382）の補色（青と緑） -->
      <stop offset="0" stop-color="#119FD5" />
      <stop offset="1" stop-color="#18CD7F" />
    </linearGradient>
  </defs>

  <!-- グラデーション背景 -->
  <rect width="400" height="400" fill="url(#grad)" />

  <!-- メーター -->
  <path
    d="M 95.8 223.6 A 115 115 0 1 1 304.2 223.6"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="24"
  />

  <!-- メーターの針 -->
  <path d="M 185 175 L 196 95 Q 200 65 204 95 L 215 175 Z" transform="rotate(45 200 175)" />
  <circle cx="200" cy="175" r="22" />

  <!-- 車のシルエット -->
  <path
    d="M 45 293 Q 42 293 41 303 L 38 333 Q 37 343 40 345 L 49 351 Q 52 353 55 353 L 70 353 A 30 30 0 0 1 130 353 H 270 A 30 30 0 0 1 330 353 L 355 353 Q 361 350 362 343 L 362 323 Q 362 313 342 310 L 262 298 L 212 263 L 132 263 L 62 293 Z"
  />
</svg>
