name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  verify:
    permissions:
      contents: read

    uses: ./.github/workflows/ci.yml

  release:
    needs: verify

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check version consistency
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' is not in the form vX.Y.Z."
            exit 1
          fi

          status=0

          package_version="$(jq -r '.version' package.json)"
          if [ "$package_version" != "$version" ]; then
            echo "::error file=package.json::version is '$package_version', expected '$version'."
            status=1
          fi

          manifest="com.github.shiguruikai.streamdeck-forza-telemetry.sdPlugin/manifest.json"
          manifest_version="$(jq -r '.Version' "$manifest")"
          if [ "$manifest_version" != "$version.0" ]; then
            echo "::error file=$manifest::Version is '$manifest_version', expected '$version.0'."
            status=1
          fi

          if ! awk -v header="## [$version] - " 'index($0, header) == 1 { found = 1 } END { exit !found }' CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::Heading '## [$version] - ' not found."
            status=1
          fi

          exit "$status"

      - name: Extract release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v header="## [$version] - " '
            index($0, header) == 1 { found = 1; next }
            found && (/^## / || /^\[.*\]: /) { exit }
            found {
              if ($0 ~ /^[ \t\r]*$/) {
                if (started) blank++
                next
              }
              started = 1
              for (; blank > 0; blank--) print ""
              print
            }
          ' CHANGELOG.md > RELEASE_NOTES.md

          if ! grep -q '[^[:space:]]' RELEASE_NOTES.md; then
            echo "::error file=CHANGELOG.md::The section for $version is empty."
            exit 1
          fi

          cat RELEASE_NOTES.md

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: 'package.json'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build plugin
        run: pnpm build

      - name: Pack plugin
        run: pnpm sd:pack

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" *.streamDeckPlugin
          --title "$GITHUB_REF_NAME"
          --notes-file RELEASE_NOTES.md
          --verify-tag
